<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Order Received — GLOVAERA
  </title>

  <meta
    name="description"
    content="Your GLOVAERA order has been received."
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

  <main class="success-page">

    <div class="success-card">

      <a
        href="index.html"
        class="success-logo"
      >

        <img
          src="logo.png"
          alt="GLOVAERA"
        >

      </a>


      <div class="success-icon">
        ✓
      </div>


      <span class="eyebrow">
        THANK YOU
      </span>


      <h1>
        Your order has been received.
      </h1>


      <p class="success-message">
        Thank you for shopping with GLOVAERA.
        We’ll contact you soon to confirm
        your order and delivery details.
      </p>


      <div class="success-order-box">

        <span>
          ORDER ID
        </span>

        <strong
          id="orderId"
        >
          —
        </strong>

      </div>


      <div class="success-actions">

        <a
          class="btn btn-primary"
          href="index.html"
        >
          Back to GLOVAERA
        </a>

        <a
          class="btn btn-secondary"
          href="shop.html"
        >
          Continue shopping
        </a>

      </div>

    </div>

  </main>


  <script>

    const orderId =
      new URLSearchParams(
        location.search
      ).get('id') || '—';


    document
      .getElementById(
        'orderId'
      )
      .textContent =
      orderId;

  </script>

</body>
</html>
