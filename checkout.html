<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Checkout — GLOVAERA</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div class="announcement">✦ COD Available · A New Era of Elegance</div><header class="site-header"><a class="brand" href="index.html"><img src="logo.png" alt="GLOVAERA"/></a><div class="header-actions"><a class="cart-link" href="cart.html">Cart <span id="cartCount" class="count-pill">0</span></a></div></header><main><section class="page-hero container"><span class="eyebrow">SECURE ORDERING</span><h1>Checkout</h1><p>Complete your details to place the order.</p></section><section class="section container"><div class="checkout-grid"><form id="checkoutForm" class="panel form-grid"><label>Full name<input required name="customer_name"/></label><label>Phone number<input required name="phone" inputmode="tel"/></label><label>District<input required name="district"/></label><label>Area / Thana<input required name="area"/></label><label class="full">Full address<textarea required name="address" rows="4"></textarea></label><label class="full">Order note (optional)<textarea name="note" rows="3"></textarea></label><div class="payment-box full"><strong>Payment method</strong><span>Cash on Delivery</span></div><button class="btn btn-primary full" type="submit">Place order</button><div id="checkoutMessage" class="form-message full"></div></form><aside id="orderSummary" class="panel"></aside></div></section></main><footer class="site-footer"><div class="container footer-bottom">© 2026 GLOVAERA</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="checkout.js"></script></body></html>
