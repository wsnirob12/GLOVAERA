<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>GLOVAERA Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><main class="admin-shell"><section id="loginView" class="admin-card"><img src="logo.png" class="admin-logo" alt="GLOVAERA"/><h1>Admin login</h1><p>Manage products, categories and orders without editing code.</p><form id="loginForm"><label>Email<input required type="email" name="email"/></label><label>Password<input required type="password" name="password"/></label><button class="btn btn-primary" type="submit">Sign in</button><div id="loginMsg" class="form-message"></div></form></section>
<section id="dashboardView" hidden><div class="admin-topbar"><div><span class="eyebrow">GLOVAERA CONTROL CENTRE</span><h1>Admin dashboard</h1></div><div class="admin-actions"><a class="btn btn-secondary" href="index.html">View store</a><button class="btn btn-dark" id="logoutBtn">Sign out</button></div></div><div class="admin-tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="categories">Categories</button><button class="tab" data-tab="orders">Orders</button></div>
<div id="tab-overview" class="tab-panel"><div id="statsGrid" class="stats-grid"></div></div>
<div id="tab-products" class="tab-panel" hidden><div class="admin-section-head"><h2>Products</h2><button class="btn btn-primary" id="addProductBtn">+ Add product</button></div><div id="productAdminList" class="admin-list"></div></div>
<div id="tab-categories" class="tab-panel" hidden><div class="admin-section-head"><h2>Categories</h2><button class="btn btn-primary" id="addCategoryBtn">+ Add category</button></div><div id="categoryAdminList" class="admin-list"></div></div>
<div id="tab-orders" class="tab-panel" hidden><div class="admin-section-head"><h2>Orders</h2><button class="btn btn-secondary" id="refreshOrdersBtn">Refresh</button></div><div id="orderAdminList" class="admin-list"></div></div>
</section></main>
<div id="modal" class="modal" hidden><div class="modal-card"><button class="modal-close" id="closeModal">×</button><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
