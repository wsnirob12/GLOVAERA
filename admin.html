<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    GLOVAERA Admin
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body class="admin-body">

<main class="admin-shell">

  <!-- LOGIN -->

  <section
    id="loginView"
    class="admin-card"
  >

    <a
      href="index.html"
      class="admin-brand-link"
    >

      <img
        src="logo.png"
        class="admin-logo"
        alt="GLOVAERA"
      >

    </a>


    <span class="eyebrow">
      GLOVAERA CONTROL CENTRE
    </span>


    <h1>
      Admin login
    </h1>


    <p>
      Manage your store and website
      without editing code.
    </p>


    <form id="loginForm">

      <label>
        Email

        <input
          required
          type="email"
          name="email"
          autocomplete="email"
        >
      </label>


      <label>
        Password

        <input
          required
          type="password"
          name="password"
          autocomplete="current-password"
        >
      </label>


      <button
        class="btn btn-primary"
        type="submit"
      >
        Sign in
      </button>


      <div
        id="loginMsg"
        class="form-message"
      ></div>

    </form>

  </section>


  <!-- DASHBOARD -->

  <section
    id="dashboardView"
    hidden
  >

    <div class="admin-topbar">

      <div>

        <span class="eyebrow">
          GLOVAERA CONTROL CENTRE
        </span>

        <h1>
          Admin dashboard
        </h1>

      </div>


      <div class="admin-actions">

        <a
          class="btn btn-secondary"
          href="index.html"
        >
          View store
        </a>

        <button
          class="btn btn-dark"
          id="logoutBtn"
          type="button"
        >
          Sign out
        </button>

      </div>

    </div>


    <div class="admin-tabs">

      <button
        class="tab active"
        data-tab="overview"
        type="button"
      >
        Overview
      </button>

      <button
        class="tab"
        data-tab="products"
        type="button"
      >
        Products
      </button>

      <button
        class="tab"
        data-tab="categories"
        type="button"
      >
        Categories
      </button>

      <button
        class="tab"
        data-tab="orders"
        type="button"
      >
        Orders
      </button>

      <!-- NEW -->
      <button
        class="tab"
        data-tab="website-editor"
        type="button"
      >
        🎨 Website Editor
      </button>

    </div>


    <!-- OVERVIEW -->

    <section
      id="tab-overview"
      class="tab-panel"
    >

      <div
        id="statsGrid"
        class="stats-grid"
      ></div>

    </section>


    <!-- PRODUCTS -->

    <section
      id="tab-products"
      class="tab-panel"
      hidden
    >

      <div
        class="admin-section-head"
      >

        <h2>
          Products
        </h2>

        <button
          class="btn btn-primary"
          id="addProductBtn"
          type="button"
        >
          + Add product
        </button>

      </div>


      <div
        id="productAdminList"
        class="admin-list"
      ></div>

    </section>


    <!-- CATEGORIES -->

    <section
      id="tab-categories"
      class="tab-panel"
      hidden
    >

      <div
        class="admin-section-head"
      >

        <h2>
          Categories
        </h2>

        <button
          class="btn btn-primary"
          id="addCategoryBtn"
          type="button"
        >
          + Add category
        </button>

      </div>


      <div
        id="categoryAdminList"
        class="admin-list"
      ></div>

    </section>


    <!-- ORDERS -->

    <section
      id="tab-orders"
      class="tab-panel"
      hidden
    >

      <div
        class="admin-section-head"
      >

        <h2>
          Orders
        </h2>

        <button
          class="btn btn-secondary"
          id="refreshOrdersBtn"
          type="button"
        >
          Refresh
        </button>

      </div>


      <div
        id="orderAdminList"
        class="admin-list"
      ></div>

    </section>


    <!-- WEBSITE EDITOR -->

    <section
      id="tab-website-editor"
      class="tab-panel"
      hidden
    >

      <div
        id="websiteEditorRoot"
      ></div>

    </section>

  </section>

</main>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
  hidden
>

  <div class="modal-card">

    <button
      class="modal-close"
      id="closeModal"
      type="button"
    >
      ×
    </button>

    <div
      id="modalContent"
    ></div>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="config.js"></script>

<script src="app.js"></script>

<script src="admin.js"></script>

<script src="site-editor.js"></script>

</body>

</html>
